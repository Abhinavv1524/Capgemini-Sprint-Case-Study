server:
  port: 8888

spring:
  application:
    name: config-server
  config:
    import: "optional:configserver:http://config-server:8888"

  cloud:
    config:
      server:
        git:
          uri: https://github.com/Abhinavv1524/skillsync-config-repo
          default-label: main

jwt:
  secret: ${JWT_SECRET:skillsync-jwt-secret-key-2026-very-strong-minimum-32-bytes}

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
